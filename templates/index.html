<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Умный Город: Интерактивная Карта</title>
    <!-- Подключаем официальный программный API Яндекс Карт -->
    <script src="https://yandex.ru" type="text/javascript"></script>
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        #map { flex-grow: 1; width: 100%; height: 100%; }
        #form-container { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 1000; background: white; padding: 15px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); width: 90%; max-width: 400px; }
        .form-group { margin-bottom: 10px; }
        .hint-text { font-size: 12px; color: #666; margin-bottom: 5px; text-align: center; font-weight: bold;}
        select, textarea, input, button { width: 100%; padding: 8px; box-sizing: border-box; border-radius: 5px; border: 1px solid #ccc; font-size: 14px; }
        button { background-color: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #218838; }
        .popup-img { width: 100%; max-width: 150px; margin-top: 5px; border-radius: 5px; display: block; }
    </style>
</head>
<body>

    <!-- Место под интерактивную карту -->
    <div id="map"></div>

    <!-- Панель отправки заявки -->
    <div id="form-container">
        <div class="hint-text">💡 Кликните на карту, чтобы выбрать место дефекта</div>
        <form id="issueForm" onsubmit="sendReport(event)">
            <!-- Скрытые поля для координат -->
            <input type="hidden" id="latitude">
            <input type="hidden" id="longitude">

            <div class="form-group">
                <select id="category" required>
                    <option value="Дороги / Ямы">Дороги / Ямы</option>
                    <option value="Освещение">Сломанный фонарь</option>
                    <option value="Мусор / Экология">Мусор / Свалка</option>
                    <option value="Доступная среда">Препятствие / Пандус</option>
                </select>
            </div>
            <div class="form-group">
                <textarea id="description" placeholder="Что случилось? Опишите дефект..." rows="2" required></textarea>
            </div>
            <div class="form-group">
                <input type="file" id="photo" accept="image/*">
            </div>
            <button type="submit">Отправить заявку и фото</button>
        </form>
    </div>

    <script type="text/javascript">
        let myMap;
        let currentPlacemark = null;

        // Инициализация карты после загрузки API Яндекса
        ymaps.ready(init);

        function init() {
            myMap = new ymaps.Map("map", {
                center: [55.7558, 37.6173], // По умолчанию центр на Москву
                zoom: 11,
                controls: ['zoomControl', 'geolocationControl']
            });

            // Слушаем клик по карте для выбора места проблемы
            myMap.events.add('click', function (e) {
                const coords = e.get('coords');

                document.getElementById('latitude').value = coords[0];
                document.getElementById('longitude').value = coords[1];

                if (currentPlacemark) {
                    currentPlacemark.geometry.setCoordinates(coords);
                } else {
                    currentPlacemark = new ymaps.Placemark(coords, {
                        hintContent: 'Выбранное место'
                    }, {
                        preset: 'islands#redCircleDotIcon',
                        draggable: true
                    });
                    myMap.geoObjects.add(currentPlacemark);
                }
            });

            // Загружаем метки из базы данных Python
            loadSavedMarkers();
        }

        async function loadSavedMarkers() {
            try {
                const response = await fetch('/api/issues');
                const issues = await response.json();

                issues.forEach(issue => {
                    let popupContent = `<b>Категория:</b> ${issue.category}<br><b>Описание:</b> ${issue.description}<br><small>${issue.date_created}</small>`;

                    if (issue.photo_path) {
                        popupContent += `<br><img src="${issue.photo_path}" class="popup-img" />`;
                    }

                    const savedPlacemark = new ymaps.Placemark([issue.latitude, issue.longitude], {
                        balloonContent: popupContent,
                        hintContent: issue.category
                    }, {
                        preset: 'islands#blueAttentionIcon'
                    });

                    myMap.geoObjects.add(savedPlacemark);
                });
            } catch (err) {
                console.error("Ошибка получения меток:", err);
            }
        }

        async function sendReport(event) {
            event.preventDefault();

            const lat = document.getElementById('latitude').value;
            const lng = document.getElementById('longitude').value;

            if (!lat || !lng) {
                alert("Пожалуйста, сначала кликните в любое место на карте, чтобы установить точку дефекта!");
                return;
            }

            const formData = new FormData();
            formData.append('category', document.getElementById('category').value);
            formData.append('description', document.getElementById('description').value);
            formData.append('latitude', lat);
            formData.append('longitude', lng);

            const photoInput = document.getElementById('photo');
            if (photoInput.files.length > 0) {
                formData.append('photo', photoInput.files[0]);
            }

            try {
                const response = await fetch('/api/report', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();
                if (result.status === "success") {
                    alert("Успешно отправлено! Метка зафиксирована.");

                    document.getElementById('description').value = '';
                    photoInput.value = '';
                    if (currentPlacemark) {
                        myMap.geoObjects.remove(currentPlacemark);
                        currentPlacemark = null;
                    }
                    document.getElementById('latitude').value = '';
                    document.getElementById('longitude').value = '';

                    // Обновляем метки на карте
                    myMap.geoObjects.each(function (geoObject) {
                        myMap.geoObjects.remove(geoObject);
                    });
                    loadSavedMarkers();

                } else {
                    alert("Ошибка сервера: " + result.message);
                }
            } catch (error) {
                alert("Ошибка отправки. Проверьте подключение к серверу.");
            }
        }
    </script>
</body>
</html>
